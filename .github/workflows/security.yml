name: Security Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  semgrep:
    name: Semgrep SAST gate
    runs-on: ubuntu-latest
    needs: tests
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep with severity gate
        run: semgrep scan --config semgrep.yml --error --severity ERROR

  dependencies:
    name: pip-audit dependency gate
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt --strict --desc

  gitleaks:
    name: Gitleaks secret gate
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

  trivy:
    name: Trivy container gate
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t devsecops-security-pipeline:${{ github.sha }} .
      - name: Scan image - HIGH/CRITICAL gate
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devsecops-security-pipeline:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

  security-summary:
    name: Security checks complete
    runs-on: ubuntu-latest
    if: always()
    needs: [semgrep, dependencies, gitleaks, trivy]
    steps:
      - name: Fail if any required security gate failed
        run: |
          echo "Semgrep: ${{ needs.semgrep.result }}"
          echo "Dependencies: ${{ needs.dependencies.result }}"
          echo "Gitleaks: ${{ needs.gitleaks.result }}"
          echo "Trivy: ${{ needs.trivy.result }}"
          if [ "${{ needs.semgrep.result }}" != "success" ] || \
             [ "${{ needs.dependencies.result }}" != "success" ] || \
             [ "${{ needs.gitleaks.result }}" != "success" ] || \
             [ "${{ needs.trivy.result }}" != "success" ]; then
            exit 1
          fi
